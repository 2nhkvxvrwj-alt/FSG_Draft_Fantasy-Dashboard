name: Fantasy reports

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Delivery mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - test
          - live
      banter_level:
        description: Banter level (1 gentle, 5 full roast)
        required: true
        default: "5"
        type: choice
        options: ["1", "2", "3", "4", "5"]
      sample:
        description: Use labelled sample data (test/dry-run only)
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17,47 * * * *"

concurrency:
  group: fantasy-reports
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.REPORT_MODE || 'test' }}
      BANTER_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.banter_level || vars.BANTER_LEVEL || '3' }}
      SAMPLE_REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.sample || 'false' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      TEST_RECIPIENT: ${{ secrets.TEST_RECIPIENT }}
      REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate or send reports
        run: |
          sample_arg=""
          if [ "$SAMPLE_REPORT" = "true" ]; then sample_arg="--sample"; fi
          python -m reports.runner --league 9292 --mode "$REPORT_MODE" --banter-level "$BANTER_LEVEL" $sample_arg

      - name: Upload dry-run previews
        if: env.REPORT_MODE == 'dry-run' || env.SAMPLE_REPORT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-report-previews
          path: report-output/
          if-no-files-found: ignore

      - name: Save sent-report state
        if: always() && env.REPORT_MODE != 'dry-run'
        run: |
          if git diff --quiet -- report-state.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report-state.json
          git commit -m "Record sent fantasy reports"
          git push
